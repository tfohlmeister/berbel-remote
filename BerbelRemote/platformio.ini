; Only the default env is built by a bare `pio run`; `native` is test-only.
[platformio]
default_envs = esp32dev

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4

; USB upload (first flash or when physically connected)
[env:esp32dev]
extends = common
upload_speed = 921600

; OTA upload (wireless, after first flash)
[env:ota]
extends = common
upload_protocol = espota
upload_port = berbel-remote.local
upload_flags =
    --host_port=3232

; ESP32-S3 boards. The manifest below is the DevKitC-1 with 8 MB flash and no
; PSRAM; modules with more of either work with it, they just leave the extra
; hardware unused. The console of an S3 is the built-in
; USB-Serial-JTAG port, and Arduino's `Serial` only reaches it when the CDC is
; mapped onto it at boot - otherwise the firmware's own log goes to UART0 and
; the console shows nothing but ESP-IDF messages.
[s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; USB upload (first flash or when physically connected)
[env:esp32s3]
extends = s3
upload_speed = 921600

; OTA upload (wireless, after first flash)
[env:ota-s3]
extends = s3
upload_protocol = espota
upload_port = berbel-remote.local
upload_flags =
    --host_port=3232

; Host-side unit tests for the pure protocol logic (no ESP32 needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -I src
