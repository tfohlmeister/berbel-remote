name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('BerbelRemote/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native -d BerbelRemote

      - name: Build firmware (compile check)
        run: |
          cp BerbelRemote/src/config.example.h BerbelRemote/src/config.h
          pio run -e esp32dev -d BerbelRemote
          pio run -e esp32s3 -d BerbelRemote

      # config.example.h only covers one combination of the hood feature flags.
      # Build the others too, otherwise a typo inside a disabled #if block
      # passes CI and breaks only for the users who enable that flag.
      - name: Build firmware (all hood feature flag combinations)
        run: |
          for lift in true false; do
            for ceiling in true false; do
              for multi in true false; do
                echo "::group::HOOD_HAS_LIFT=$lift HOOD_HAS_CEILING_LIGHT=$ceiling HOOD_HAS_MULTI_BUTTON=$multi"
                sed -e "s/^#define HOOD_HAS_LIFT .*/#define HOOD_HAS_LIFT $lift/" \
                    -e "s/^#define HOOD_HAS_CEILING_LIGHT .*/#define HOOD_HAS_CEILING_LIGHT $ceiling/" \
                    -e "s/^#define HOOD_HAS_MULTI_BUTTON .*/#define HOOD_HAS_MULTI_BUTTON $multi/" \
                    BerbelRemote/src/config.example.h > BerbelRemote/src/config.h
                pio run -e esp32dev -d BerbelRemote
                echo "::endgroup::"
              done
            done
          done
