name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('BerbelRemote/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native -d BerbelRemote

      # The fake hood's protocol half lives in tools/fakehood/hood.py and
      # imports no Bluetooth stack, so its tests run here without bleak.
      - name: Run fake hood tests
        run: python -m unittest discover -s tools/fakehood -p "test_*.py" -v

      - name: Build firmware (compile check)
        run: |
          cp BerbelRemote/src/config.example.h BerbelRemote/src/config.h
          pio run -e esp32dev -d BerbelRemote
          pio run -e esp32s3 -d BerbelRemote

      # Each remote profile switches different entities and button codes on, so
      # a build that only ever sees the default one never compiles the others.
      - name: Build firmware (all remote profiles)
        run: |
          for profile in REMOTE_BFB_6BT REMOTE_BFB_8BT REMOTE_BFB_7BT; do
            echo "::group::REMOTE_PROFILE=$profile"
            sed -e "s/^#define REMOTE_PROFILE .*/#define REMOTE_PROFILE $profile/" \
                -e "s/^#define HOOD_HAS_CEILING_LIGHT .*/#define HOOD_HAS_CEILING_LIGHT true/" \
                BerbelRemote/src/config.example.h > BerbelRemote/src/config.h
            pio run -e esp32dev -d BerbelRemote
            echo "::endgroup::"
          done

      # config.example.h only covers one combination of the hood feature flags.
      # Build the others too, otherwise a typo inside a disabled #if block
      # passes CI and breaks only for the users who enable that flag.
      # The 6bT profile is the example's default, so without the profile loop
      # here the 7bT's #if blocks would only ever be compiled at one flag
      # combination and a typo under, say, HOOD_HAS_LIFT=false would pass.
      - name: Build firmware (all hood feature flag combinations)
        run: |
          for profile in REMOTE_BFB_6BT REMOTE_BFB_7BT; do
            for lift in true false; do
              for ceiling in true false; do
                for multi in true false; do
                  echo "::group::$profile LIFT=$lift CEILING=$ceiling MULTI=$multi"
                  sed -e "s/^#define REMOTE_PROFILE .*/#define REMOTE_PROFILE $profile/" \
                      -e "s/^#define HOOD_HAS_LIFT .*/#define HOOD_HAS_LIFT $lift/" \
                      -e "s/^#define HOOD_HAS_CEILING_LIGHT .*/#define HOOD_HAS_CEILING_LIGHT $ceiling/" \
                      -e "s/^#define HOOD_HAS_MULTI_BUTTON .*/#define HOOD_HAS_MULTI_BUTTON $multi/" \
                      BerbelRemote/src/config.example.h > BerbelRemote/src/config.h
                  pio run -e esp32dev -d BerbelRemote
                  echo "::endgroup::"
                done
              done
            done
          done
